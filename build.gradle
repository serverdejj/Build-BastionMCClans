plugins { id 'java' }
group = 'mc.bastion'
version = '0.1.0-beta'
repositories { mavenCentral(); maven { url = 'https://repo.purpurmc.org/snapshots' } }
dependencies { compileOnly 'org.purpurmc.purpur:purpur-api:1.21.11-R0.1-SNAPSHOT' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
