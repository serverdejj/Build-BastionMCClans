plugins { id 'java' }
group = 'mc.bastion'
version = '0.1.1-beta'
repositories { mavenCentral(); maven { url = 'https://repo.purpurmc.org/snapshots' }; maven { url = 'https://repo.extendedclip.com/releases/' } }
dependencies { compileOnly 'org.purpurmc.purpur:purpur-api:1.21.11-R0.1-SNAPSHOT'; compileOnly 'me.clip:placeholderapi:2.11.6' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
